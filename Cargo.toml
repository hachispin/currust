[package]
name = "currust"
version = "1.4.1"
edition = "2024"
description = "A tool to convert Windows (CUR/ANI) cursor themes to Linux (Xcursor) cursor themes."
readme = "README.md"
repository = "https://github.com/hachispin/currust"
license = "MIT"
keywords = ["ani", "cursor-converter", "cursor-theme", "scaling", "xcursor"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
anyhow = "1.0.100"
binrw = "0.15.0"
bytemuck = "1.25.0"
clap = { version = "4.5.53", features = ["derive"] }
configparser = "3.1.0"
dialoguer = "0.12.0"
documented = "0.9.2"
fast_image_resize = { version = "6.0.0", features = ["rayon"] }
ico = "0.5.0"
rayon = "1.11.0"

[dev-dependencies]
libc = "0.2.180"
tempfile = "3.24.0"
x11 = "2.21.0"

[profile.release]
lto = "fat"

[profile.dist]
inherits = "release"
