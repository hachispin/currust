name: Publish to crates.io

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check tag matches Cargo.toml
        shell: bash
        run: |
          version=$(cargo +stable metadata --no-deps --locked --format-version 1 | jq -er '.packages[] | select(.name == "currust") | .version')

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected tag v$version, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Authenticate to crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish currust
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
